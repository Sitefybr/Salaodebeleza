<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Web BedWars</title>

<style>

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    color: white;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
}

#ui {

    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 10;

    background: rgba(0,0,0,.65);

    padding: 12px 15px;

    border-radius: 10px;

    font-size: 15px;

    pointer-events: none;

}

#info {

    position: fixed;

    bottom: 15px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(0,0,0,.65);

    padding: 10px 18px;

    border-radius: 10px;

    white-space: nowrap;

    font-size: 14px;

    pointer-events: none;

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

❤️ Vida:
<span id="hp">100</span>

<br>

⚔️ Combo:
<span id="combo">0</span>

<br>

👾 Inimigos:
<span id="enemies">0</span>

</div>

<div id="info">

WASD = mover
&nbsp; | &nbsp;
Mouse = mirar
&nbsp; | &nbsp;
Clique = atacar

</div>


<script>


/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");

const ctx = canvas.getContext("2d", {
    alpha: false
});


/*
   Resolução interna limitada.

   Isso evita que monitores 2K/4K
   façam o jogo desenhar milhões
   de pixels desnecessariamente.
*/

let width = 0;
let height = 0;


function resize() {

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width;
    canvas.height = height;

    /*
       Se o jogador redimensionar a janela,
       mantém o jogador dentro da tela.
    */

    player.x = Math.max(
        25,
        Math.min(width - 25, player.x)
    );

    player.y = Math.max(
        25,
        Math.min(height - 25, player.y)
    );

}


window.addEventListener("resize", resize);


/* =========================================================
   CONTROLES
========================================================= */

const keys = Object.create(null);


window.addEventListener("keydown", e => {

    const key = e.key.toLowerCase();

    if (
        key === "w" ||
        key === "a" ||
        key === "s" ||
        key === "d"
    ) {

        keys[key] = true;

        e.preventDefault();

    }

});


window.addEventListener("keyup", e => {

    const key = e.key.toLowerCase();

    if (
        key === "w" ||
        key === "a" ||
        key === "s" ||
        key === "d"
    ) {

        keys[key] = false;

        e.preventDefault();

    }

});


/* =========================================================
   MOUSE / MIRA
========================================================= */

const mouse = {

    x: 0,
    y: 0

};


canvas.addEventListener("mousemove", e => {

    /*
       Atualização direta.

       Não usamos animação,
       interpolação ou setTimeout.

       Resultado:
       mira praticamente instantânea.
    */

    mouse.x = e.clientX;
    mouse.y = e.clientY;

});


/*
   Impede ações do navegador.
*/

canvas.addEventListener("contextmenu", e => {

    e.preventDefault();

});


canvas.addEventListener("selectstart", e => {

    e.preventDefault();

});


canvas.addEventListener("dragstart", e => {

    e.preventDefault();

});


canvas.addEventListener("auxclick", e => {

    e.preventDefault();

});


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x: 0,
    y: 0,

    size: 25,

    speed: 260,

    hp: 100,

    combo: 0,

    attackCooldown: 0,

    attackAnimation: 0,

    comboTimer: 0

};


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

resize();

player.x = width / 2;
player.y = height / 2;

mouse.x = width / 2;
mouse.y = height / 2;


/* =========================================================
   NPCs
========================================================= */

const enemies = [];

const MAX_ENEMIES = 5;


/*
   Cria NPC.
*/

function spawnEnemy() {

    if (enemies.length >= MAX_ENEMIES)
        return;


    const side = Math.floor(Math.random() * 4);

    let x;
    let y;


    if (side === 0) {

        x = Math.random() * width;
        y = -50;

    }

    else if (side === 1) {

        x = width + 50;
        y = Math.random() * height;

    }

    else if (side === 2) {

        x = Math.random() * width;
        y = height + 50;

    }

    else {

        x = -50;
        y = Math.random() * height;

    }


    enemies.push({

        x: x,
        y: y,

        size: 25,

        hp: 100,

        speed: 75,

        knockX: 0,
        knockY: 0,

        hitTimer: 0

    });

}


/*
   Spawn mais espaçado.

   Primeiro NPC depois de 2 segundos.
   Depois aproximadamente a cada 3 segundos.
*/

let spawnTimer = 2;

spawnEnemy();


/* =========================================================
   ATAQUE
========================================================= */

canvas.addEventListener("mousedown", e => {

    /*
       Bloqueia o navegador.

       Isso é importante para evitar
       comportamentos estranhos do clique.
    */

    e.preventDefault();


    /*
       Somente botão esquerdo.
    */

    if (e.button !== 0)
        return;


    attack();

});


function attack() {

    if (player.attackCooldown > 0)
        return;


    /*
       Cooldown pequeno.
    */

    player.attackCooldown = 0.16;

    player.attackAnimation = 0.12;


    /*
       Direção do mouse.
    */

    let dx = mouse.x - player.x;
    let dy = mouse.y - player.y;


    const distance =
        Math.sqrt(dx * dx + dy * dy);


    if (distance < 0.001)
        return;


    const dirX = dx / distance;
    const dirY = dy / distance;


    let hit = false;


    /*
       Percorre os NPCs.
    */

    for (let i = 0; i < enemies.length; i++) {

        const enemy = enemies[i];


        let ex =
            enemy.x - player.x;

        let ey =
            enemy.y - player.y;


        const enemyDistance =
            Math.sqrt(ex * ex + ey * ey);


        /*
           Alcance.
        */

        if (enemyDistance > 75)
            continue;


        /*
           Direção até o inimigo.
        */

        ex /= enemyDistance;
        ey /= enemyDistance;


        /*
           Verifica se está na frente.

           0.45 permite um cone de ataque.
        */

        const dot =
            dirX * ex +
            dirY * ey;


        if (dot < 0.45)
            continue;


        /*
           HIT
        */

        hit = true;

        enemy.hp -= 25;

        enemy.hitTimer = 0.10;


        /*
           Knockback.
        */

        enemy.knockX =
            dirX * 360;

        enemy.knockY =
            dirY * 360;


        /*
           Combo.
        */

        player.combo++;

        player.comboTimer = 0.9;

    }


    if (!hit) {

        player.combo = 0;

    }

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt) {


    /*
       Evita problemas caso o navegador
       trave por algum motivo.
    */

    dt = Math.min(dt, 0.05);


    /* --------------------------------
       MOVIMENTO
    -------------------------------- */

    let moveX = 0;
    let moveY = 0;


    if (keys["w"])
        moveY -= 1;

    if (keys["s"])
        moveY += 1;

    if (keys["a"])
        moveX -= 1;

    if (keys["d"])
        moveX += 1;


    /*
       Movimento diagonal não fica
       mais rápido que o normal.
    */

    if (moveX !== 0 || moveY !== 0) {

        const length =
            Math.sqrt(
                moveX * moveX +
                moveY * moveY
            );


        moveX /= length;
        moveY /= length;


        player.x +=
            moveX *
            player.speed *
            dt;


        player.y +=
            moveY *
            player.speed *
            dt;

    }


    /* --------------------------------
       LIMITES
    -------------------------------- */

    player.x = Math.max(
        15,
        Math.min(width - 15, player.x)
    );


    player.y = Math.max(
        15,
        Math.min(height - 15, player.y)
    );


    /* --------------------------------
       ATAQUE
    -------------------------------- */

    if (player.attackCooldown > 0)
        player.attackCooldown -= dt;


    if (player.attackAnimation > 0)
        player.attackAnimation -= dt;


    /* --------------------------------
       COMBO
    -------------------------------- */

    if (player.comboTimer > 0) {

        player.comboTimer -= dt;

    }
    else {

        player.combo = 0;

    }


    /* --------------------------------
       SPAWN
    -------------------------------- */

    spawnTimer -= dt;


    if (spawnTimer <= 0) {

        spawnEnemy();

        spawnTimer = 3;

    }


    /* --------------------------------
       NPCs
    -------------------------------- */

    for (let i = enemies.length - 1; i >= 0; i--) {

        const enemy = enemies[i];


        /* Knockback */

        enemy.x +=
            enemy.knockX * dt;

        enemy.y +=
            enemy.knockY * dt;


        /*
           Fricção do knockback.
        */

        enemy.knockX *=
            Math.pow(0.02, dt);

        enemy.knockY *=
            Math.pow(0.02, dt);


        /* Hit timer */

        if (enemy.hitTimer > 0)
            enemy.hitTimer -= dt;


        /*
           IA.
        */

        const dx =
            player.x - enemy.x;

        const dy =
            player.y - enemy.y;


        const distance =
            Math.sqrt(dx * dx + dy * dy);


        if (distance > 38) {

            enemy.x +=
                (dx / distance) *
                enemy.speed *
                dt;


            enemy.y +=
                (dy / distance) *
                enemy.speed *
                dt;

        }
        else {

            /*
               Dano reduzido e baseado
               no tempo.
            */

            player.hp -=
                9 * dt;

        }


        /*
           Remove morto.
        */

        if (enemy.hp <= 0) {

            enemies.splice(i, 1);

        }

    }


    /* --------------------------------
       MORTE
    -------------------------------- */

    if (player.hp <= 0) {

        player.hp = 100;

        enemies.length = 0;

        player.combo = 0;

        player.comboTimer = 0;

    }

}


/* =========================================================
   DESENHO
========================================================= */

function draw() {


    /*
       Fundo.
    */

    ctx.fillStyle = "#55a84f";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* --------------------------------
       ILHA
    -------------------------------- */

    ctx.fillStyle = "#c9a66b";

    ctx.fillRect(

        width / 2 - 180,

        height / 2 - 130,

        360,

        260

    );


    /* --------------------------------
       CAMA
    -------------------------------- */

    ctx.fillStyle = "#e53935";

    ctx.fillRect(

        width / 2 - 45,

        height / 2 - 20,

        90,

        40

    );


    /* --------------------------------
       DIREÇÃO DA MIRA
    -------------------------------- */

    let dx =
        mouse.x - player.x;

    let dy =
        mouse.y - player.y;


    const distance =
        Math.sqrt(dx * dx + dy * dy);


    let dirX = 0;
    let dirY = 0;


    if (distance > 0) {

        dirX = dx / distance;
        dirY = dy / distance;

    }


    /*
       Linha de mira bem discreta.
    */

    ctx.strokeStyle =
        "rgba(255,255,255,0.18)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        player.x,
        player.y
    );

    ctx.lineTo(

        player.x +
        dirX * 55,

        player.y +
        dirY * 55

    );

    ctx.stroke();


    /* --------------------------------
       PLAYER
    -------------------------------- */

    ctx.fillStyle = "#3498db";

    ctx.fillRect(

        player.x -
        player.size / 2,

        player.y -
        player.size / 2,

        player.size,

        player.size

    );


    /* --------------------------------
       ESPADA
    -------------------------------- */

    if (player.attackAnimation > 0) {

        /*
           A espada fica maior
           durante o golpe.
        */

        const swordLength = 52;

        ctx.strokeStyle = "white";

        ctx.lineWidth = 7;

        ctx.lineCap = "round";


        ctx.beginPath();

        ctx.moveTo(

            player.x,

            player.y

        );


        ctx.lineTo(

            player.x +
            dirX * swordLength,

            player.y +
            dirY * swordLength

        );


        ctx.stroke();


        ctx.lineCap = "butt";

    }


    /* --------------------------------
       NPCs
    -------------------------------- */

    for (let i = 0; i < enemies.length; i++) {

        const enemy = enemies[i];


        /*
           NPC.
        */

        ctx.fillStyle =
            enemy.hitTimer > 0
            ? "#ffffff"
            : "#e74c3c";


        ctx.fillRect(

            enemy.x -
            enemy.size / 2,

            enemy.y -
            enemy.size / 2,

            enemy.size,

            enemy.size

        );


        /*
           Barra preta.
        */

        ctx.fillStyle = "#111";

        ctx.fillRect(

            enemy.x - 20,

            enemy.y - 25,

            40,

            5

        );


        /*
           Vida.
        */

        ctx.fillStyle = "#2ecc71";

        ctx.fillRect(

            enemy.x - 20,

            enemy.y - 25,

            40 *
            Math.max(
                0,
                enemy.hp / 100
            ),

            5

        );

    }

}


/* =========================================================
   UI
========================================================= */

const hpElement =
    document.getElementById("hp");

const comboElement =
    document.getElementById("combo");

const enemiesElement =
    document.getElementById("enemies");


let lastHP = -1;
let lastCombo = -1;
let lastEnemies = -1;


function updateUI() {


    const hp =
        Math.floor(player.hp);


    const combo =
        player.combo;


    const enemyCount =
        enemies.length;


    /*
       Só altera o HTML quando
       o valor realmente mudou.
    */

    if (hp !== lastHP) {

        hpElement.textContent = hp;

        lastHP = hp;

    }


    if (combo !== lastCombo) {

        comboElement.textContent = combo;

        lastCombo = combo;

    }


    if (enemyCount !== lastEnemies) {

        enemiesElement.textContent =
            enemyCount;

        lastEnemies = enemyCount;

    }

}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime = performance.now();


function gameLoop(currentTime) {


    /*
       Tempo entre frames.
    */

    let dt =
        (currentTime - lastTime) / 1000;


    lastTime = currentTime;


    /*
       Limite de segurança.
    */

    dt = Math.min(dt, 0.05);


    update(dt);

    draw();

    updateUI();


    requestAnimationFrame(gameLoop);

}


/* =========================================================
   INICIAR
========================================================= */

requestAnimationFrame(gameLoop);

</script>

</body>
</html>
```
